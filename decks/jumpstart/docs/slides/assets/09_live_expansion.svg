<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#160F0E"/>
  <text x="800" y="90" font-family="Arial, sans-serif" font-size="50" font-weight="700" text-anchor="middle" fill="#FFFFFF">새로운 마을 하나가 플레이와 수집을 함께 확장한다</text>
  <g stroke="#FFC94A" stroke-width="8"><line x1="800" y1="450" x2="400" y2="250"/><line x1="800" y1="450" x2="1200" y2="250"/><line x1="800" y1="450" x2="400" y2="650"/><line x1="800" y1="450" x2="1200" y2="650"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700">
    <circle cx="800" cy="450" r="145" fill="#E8422E"/><text x="800" y="438" fill="white" font-size="40">신규 마을</text><text x="800" y="488" fill="#FFD8D1" font-size="27">하나의 업데이트 단위</text>
    <g><rect x="220" y="150" width="360" height="180" rx="36" fill="#FFC94A"/><text x="400" y="225" fill="#38240A" font-size="34">전투장 · 보스</text><text x="400" y="275" fill="#6B4712" font-size="25">새로운 전투 리듬</text></g>
    <g><rect x="1020" y="150" width="360" height="180" rx="36" fill="#55D8FF"/><text x="1200" y="225" fill="#173C48" font-size="34">무기 티어</text><text x="1200" y="275" fill="#285F70" font-size="25">새로운 파밍 목표</text></g>
    <g><rect x="220" y="570" width="360" height="180" rx="36" fill="#67A844"/><text x="400" y="645" fill="white" font-size="34">펫 알</text><text x="400" y="695" fill="#E6F6D2" font-size="25">수집과 경제 성장</text></g>
    <g><rect x="1020" y="570" width="360" height="180" rx="36" fill="#A36BFF"/><text x="1200" y="645" fill="white" font-size="34">외형 · 이펙트</text><text x="1200" y="695" fill="#EFE3FF" font-size="25">파밍을 지우지 않는 상품</text></g>
    <text x="800" y="835" fill="#FFFFFF" font-size="28">최고 무기와 핵심 진행은 플레이로 획득한다.</text>
  </g>
</svg>
