<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="projects_roblox_page_title">Roblox 프로젝트 - NNN GAMES</title>
    <meta name="description" content="Explore NNN GAMES’ Roblox projects and UGC portfolio with filters for category, status, and keywords.">
    <meta name="keywords" content="Roblox projects, UGC portfolio, NNN GAMES, Roblox studio">
    <meta property="og:title" content="Roblox Projects | NNN GAMES Roblox Portfolio">
    <meta property="og:description" content="Browse Roblox projects and UGC work by NNN GAMES with filters for quick discovery.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/nnn-logo.png">
    <meta property="og:site_name" content="NNN GAMES">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Roblox Projects | NNN GAMES Roblox Portfolio">
    <meta name="twitter:description" content="Browse Roblox projects and UGC work by NNN GAMES with filters for quick discovery.">
    <meta name="twitter:image" content="images/nnn-logo.png">
    <!-- @include head-common -->
</head>

<body data-projects-scope="roblox">
    <!-- @include header active="projects" -->

    <main>
        <section class="page-header">
            <div class="container">
                <h1 data-key="projects_roblox_page_header">Roblox 프로젝트</h1>
                <p data-key="project_preview_title">진행 중인 프로젝트</p>
            </div>
        </section>

        <!-- 필터/검색 -->
        <section class="project-controls container">
            <div class="project-controls-header">
                <div>
                    <p class="section-kicker" data-key="projects_filter_kicker">Portfolio Explorer</p>
                    <h2 data-key="projects_filter_title">필터로 맞는 프로젝트를 빠르게 찾기</h2>
                    <p data-key="projects_filter_desc">카테고리, 진행 상태, 키워드로 포트폴리오를 바로 좁힐 수 있습니다.</p>
                </div>
                <button id="resetFilters" type="button" class="btn-ghost" data-key="projects_filter_reset">필터 초기화</button>
            </div>
            <div class="project-filters grid gap-4 sm:gap-5 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 items-center">
                <div class="filter-field space-y-1">
                    <label for="categoryFilter" class="block font-semibold text-brand-secondary" data-key="projects_filter_category_label">카테고리</label>
                    <select id="categoryFilter" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg bg-white text-sm text-brand-secondary focus:border-brand-primary focus:ring focus:ring-brand-primary/20">
                        <option value="all" data-key="projects_filter_option_all">전체</option>
                        <option value="roblox" data-key="projects_filter_option_roblox">Roblox</option>
                    </select>
                </div>
                <div class="filter-field space-y-1">
                    <label for="statusFilter" class="block font-semibold text-brand-secondary" data-key="projects_filter_status_label">상태</label>
                    <select id="statusFilter" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg bg-white text-sm text-brand-secondary focus:border-brand-primary focus:ring focus:ring-brand-primary/20">
                        <option value="all" data-key="projects_filter_option_all">전체</option>
                        <option value="active" data-key="projects_filter_option_active">운영 중</option>
                        <option value="development" data-key="projects_filter_option_development">개발 중</option>
                        <option value="completed" data-key="projects_filter_option_completed">완료</option>
                        <option value="paused" data-key="projects_filter_option_paused">일시중단</option>
                    </select>
                </div>
                <div class="filter-field space-y-1">
                    <label for="keywordFilter" class="block font-semibold text-brand-secondary" data-key="projects_filter_keyword_label">검색</label>
                    <input id="keywordFilter" type="text" placeholder="프로젝트 검색" data-key-placeholder="projects_filter_keyword_placeholder" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg bg-white text-sm text-brand-secondary focus:border-brand-primary focus:ring focus:ring-brand-primary/20">
                </div>
            </div>
            <div class="project-filter-summary">
                <p id="projectResultsText" data-key="projects_filter_results_default">전체 프로젝트를 표시하고 있습니다.</p>
            </div>
        </section>

        <!-- 현재 진행 중인 프로젝트 -->
        <section class="project-preview container">
            <div class="project-grid" id="all-projects-grid">
                <!-- 프로젝트 카드들은 project-renderer.js에 의해 동적으로 생성됩니다 -->
            </div>
            <p id="projectEmptyState" class="project-empty hidden" data-key="projects_empty_state">조건에 맞는 프로젝트가 없습니다. 필터를 조정해 주세요.</p>
        </section>

        <section class="project-preview container" id="specialProjectSection">
            <div class="section-header section-header-left">
                <p class="section-kicker">UGC</p>
                <h2>NNN UGC</h2>
            </div>
            <div class="project-grid" id="special-projects-grid">
                <!-- NNN UGC 카드는 별도 섹션으로 렌더링됩니다 -->
            </div>
        </section>
    </main>

    <!-- @include footer -->

    <script defer src="js/utils.js"></script>
    <script defer src="js/projects-data.js"></script>
    <script defer src="js/project-renderer.js"></script>
    <script defer src="js/i18n.js"></script>
    <script defer src="js/main.js"></script>
</body>

</html>
