# 정기 점검 (audit-site)
# - 매주 월요일 10:00 KST(01:00 UTC) 와 수동 실행 시 scripts/audit.js 를 돌려 보고서를 만들고,
#   "정기 점검 보고" 이슈를 생성·갱신한다 (열린 이슈가 있으면 본문을 교체하고 코멘트로 알린다).
# - 코드를 수정하거나 커밋하지 않는다. 조치는 사람이 스킬(/refresh-metrics, /update-project, /update-deck …)로 진행한다.
name: Site audit

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 빌드
        run: npm run build

      - name: 점검
        run: npm run audit

      - uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_number }}
          path: exports/audit
          retention-days: 90

      - name: 이슈 생성·갱신
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('exports/audit/latest.md', 'utf8');
            const marker = '<!-- site-audit -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n실행: ${runUrl}`;
            const title = `정기 점검 보고 ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'audit', per_page: 10
            });
            const existing = issues.find((i) => i.body && i.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, title, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `보고서를 갱신했습니다 (${title}). ${runUrl}` });
            } else {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'audit' });
              } catch (_error) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'audit', color: '0E8A16', description: '정기 점검 보고' });
              }
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['audit'] });
            }
