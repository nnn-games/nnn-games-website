# 사이트 빌드 + GitHub Pages 배포
# - main 푸시 시, 수동 실행 시, 그리고 metrics.yml 이 지표를 커밋한 뒤 호출(workflow_call)할 때 실행된다.
# - 저장소 Settings > Pages > Source 가 "GitHub Actions" 로 설정되어 있어야 한다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call 로 호출될 때 호출 시점 SHA 가 아니라 브랜치 최신 커밋(방금 푸시된 지표 포함)을 받는다.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 검증 (i18n / links / data / lint)
        run: npm run check

      - name: 빌드 (Tailwind + dist 조립)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
